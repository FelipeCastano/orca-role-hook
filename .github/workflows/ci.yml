# shellcheck and smoke tests on every push to main and every pull request.
# The tests run on Ubuntu and on macOS; on macOS with the system bash 3.2, which is what Mac users have.
name: ci

# push only on main: on a branch with an open PR, the pull_request event already covers it (otherwise every change runs twice)
on:
  push:
    branches: [main]
  pull_request:

# a new push to a PR cancels the run still going for its previous push; on main every merge keeps its own run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning install.sh bin/*.sh tests/*.sh tests/live/*.sh

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # one section per CPU: GitHub's runners for public repos have 4 (ubuntu) and 3 (macos); smoke.sh's default, half the CPUs, ran macOS serially
        include:
          - os: ubuntu-latest
            jobs: 4
          - os: macos-latest
            jobs: 3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - run: bash --version | head -1 && jq --version
      - run: tests/smoke.sh
        env:
          SMOKE_CLI_TIMEOUT: 60
          SMOKE_JOBS: ${{ matrix.jobs }}
