# shellcheck y pruebas de humo en cada push y pull request.
# Las pruebas corren en Ubuntu y en macOS; en macOS con el bash 3.2 del sistema, que es el que tienen los usuarios de Mac.
name: ci

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning install.sh bin/*.sh tests/*.sh

  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Usar el bash 3.2 del sistema (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"
      - run: bash --version | head -1 && jq --version
      - run: tests/smoke.sh
